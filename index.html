<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>the playground — Molly's Internet</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="../style.css"></head><body><div class="shell"><div class="browser"><div class="chrome"><span>✳ mollysinternet.exe / playground</span><span class="controls">▁ □ ×</span></div><div class="inner"><a class="back" href="../">← back to home</a><section class="window"><h2>✿ the playground</h2><div class="body"><p>Tiny tools, experiments, quizzes, and things to click.</p><div id="entries" class="collection"><p>More coming soon! ✳</p></div></div></section></div></div><footer class="footer">✳ forever under construction ✳</footer></div><script>fetch('../content/playground.json').then(r=>r.json()).then(items=>{let root=document.getElementById('entries');root.replaceChildren(...items.map(x=>{let article=document.createElement('article');article.className='entry';let title=document.createElement('h3');title.textContent=x.title;let desc=document.createElement('p');desc.textContent=x.description;article.append(title,desc);if(x.url){let a=document.createElement('a');a.href=x.url;a.textContent='open project ↗';article.append(a)}return article}))}).catch(()=>{});</script></body></html>
